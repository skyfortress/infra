apiVersion: v1
kind: Namespace
metadata:
  name: langy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langy-deployment
  namespace: langy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langy-server
  template:
    metadata:
      labels:
        app: langy-server
    spec:
      nodeSelector:
        homelab: "true"
      containers:
        - name: langy-pod
          image: docker.io/skyfortress/langy:latest
          envFrom:
            - secretRef:
                name: langy-secrets
          ports:
            - containerPort: 3000
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: langy-server
  namespace: langy
spec:
  selector:
    app: langy-server
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
  type: NodePort
